# Netlify configuration for Bibliophile Vibes SPA
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Disable Netlify secrets scanner from blocking public frontend variables (e.g. site name, phone number)
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SITE_NAME,VITE_WHATSAPP_NUMBER,VITE_LOCATION,VITE_SUPABASE_ANON_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify configuration for Bibliophile Vibes SPA
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Tell Netlify that public frontend branding/contact variables are not confidential secrets
  SECRETS_SCAN_OMIT_KEYS = "VITE_SITE_NAME,VITE_WHATSAPP_NUMBER,VITE_LOCATION,VITE_SUPABASE_ANON_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
